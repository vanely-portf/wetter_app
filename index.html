<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wetter-Männli</title>
  <meta name="description" content="Das Männli zeigt dir, was du heute anziehen sollst.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a90d9">

  <!-- iPhone: App ohne Browser-Leiste starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Männli">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body class="wetter-sonne">

  <!-- Hintergrund-Effekte (Regen, Schnee) werden per JavaScript hier eingefügt -->
  <div id="effekte" aria-hidden="true"></div>

  <main>
    <header class="nur-wetter">
      <h1 id="ort">Wetter-Männli</h1>
      <form id="suche">
        <input id="suchfeld" type="search" placeholder="Ort suchen, z.B. Bern" autocomplete="off">
        <button type="submit" aria-label="Suchen">🔍</button>
        <button type="button" id="gps" aria-label="Meinen Standort verwenden">📍</button>
      </form>
    </header>

    <!-- Hinweis, wenn ein Tag aus der 5-Tage-Vorhersage angeschaut wird -->
    <div id="vorschau-banner" class="banner" hidden>
      <span id="vorschau-text"></span>
      <button type="button" id="vorschau-zurueck">Zurück zu jetzt</button>
    </div>

    <section class="aktuell nur-wetter">
      <div class="temp" id="temp">--°</div>
      <div class="beschreibung" id="beschreibung">Lade Wetter …</div>
      <div class="details" id="details"></div>
    </section>

    <!-- ===================== DAS MÄNNLI =====================
         Jedes Kleidungsstück ist eine eigene Gruppe <g> mit einer ID (k-...).
         Frisuren haben IDs h-... und Extras e-...
         Farben kommen aus CSS-Variablen (--haut, --haar, --auge, --farbe),
         die app.js setzt. Die Reihenfolge im SVG = Ebenen. -->
    <section class="maennli-box">
      <svg id="maennli" viewBox="-10 -30 230 320" role="img" aria-label="Männli mit passender Kleidung">

        <!-- Schatten am Boden -->
        <ellipse cx="100" cy="280" rx="48" ry="6" fill="rgba(0,0,0,.18)"/>

        <!-- Regenschirm (hinter dem Körper) -->
        <g id="k-schirm" class="kleid">
          <line x1="150" y1="0" x2="150" y2="186" stroke="#444" stroke-width="3"/>
          <path d="M150 186 q0 10 -8 8" stroke="#444" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M82 36 Q150 -34 218 36 Q201 27 184 36 Q167 27 150 36 Q133 27 116 36 Q99 27 82 36Z" fill="#e94b5f"/>
          <path d="M150 -1 Q128 10 116 36 M150 -1 Q172 10 184 36" stroke="#c23a4d" stroke-width="1.5" fill="none"/>
          <line x1="150" y1="-1" x2="150" y2="-12" stroke="#444" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Haare hinten (lange Haare / Zopf) -->
        <g id="h-lang-hinten" class="frisur">
          <path class="haar" d="M70 62 Q66 34 100 34 Q134 34 130 62 L136 116 Q120 124 112 106 L88 106 Q80 124 64 116Z"/>
        </g>
        <g id="h-zopf-hinten" class="frisur">
          <path class="haar" d="M122 48 Q152 52 146 96 Q140 106 136 100 Q142 74 120 62Z"/>
          <circle cx="126" cy="52" r="4.5" class="farbe"/>
        </g>

        <!-- Basis: Beine, Arme, Hände, Hals (Haut) -->
        <g id="basis">
          <rect class="haut" x="78" y="190" width="18" height="80" rx="6"/>
          <rect class="haut" x="104" y="190" width="18" height="80" rx="6"/>
          <rect class="haut" x="52" y="110" width="16" height="76" rx="8"/>
          <rect class="haut" x="132" y="110" width="16" height="76" rx="8"/>
          <!-- Hände mit Daumen -->
          <circle class="haut" cx="60" cy="190" r="8"/>
          <ellipse class="haut-d" cx="66" cy="186" rx="3" ry="4.5"/>
          <circle class="haut" cx="140" cy="190" r="8"/>
          <ellipse class="haut-d" cx="134" cy="186" rx="3" ry="4.5"/>
          <!-- Hals mit Schatten -->
          <rect class="haut" x="92" y="92" width="16" height="16"/>
          <path class="haut-d" d="M92 92 H108 V98 Q100 104 92 98Z"/>
        </g>

        <!-- Hosen (Jeans mit Gürtel und Nähten) -->
        <g id="k-hose" class="kleid">
          <rect x="76" y="190" width="22" height="80" rx="5" fill="#3b5b8c"/>
          <rect x="102" y="190" width="22" height="80" rx="5" fill="#3b5b8c"/>
          <rect x="76" y="184" width="48" height="16" rx="4" fill="#3b5b8c"/>
          <rect x="76" y="184" width="48" height="6" rx="2" fill="#5a3a22"/>
          <rect x="96" y="183.5" width="8" height="7" rx="1.5" fill="#d9b54a"/>
          <path d="M100 191 V214 M86 200 V268 M114 200 V268" stroke="#2f4a73" stroke-width="1.5" fill="none"/>
          <path d="M78 194 Q86 200 92 194 M108 194 Q114 200 122 194" stroke="#2f4a73" stroke-width="1.5" fill="none"/>
        </g>
        <g id="k-shorts" class="kleid">
          <rect x="76" y="184" width="48" height="16" rx="4" fill="#4c8a5a"/>
          <rect x="76" y="192" width="22" height="28" rx="5" fill="#4c8a5a"/>
          <rect x="102" y="192" width="22" height="28" rx="5" fill="#4c8a5a"/>
          <rect x="76" y="184" width="48" height="6" rx="2" fill="#3a6b45"/>
          <path d="M77 215 H97 M103 215 H123 M100 191 V208" stroke="#3a6b45" stroke-width="1.5"/>
        </g>

        <!-- Turnschuhe -->
        <g id="k-schuhe" class="kleid">
          <path d="M72 274 Q72 262 84 262 Q96 262 98 270 L98 276 H72Z" fill="#e8e8e8"/>
          <path d="M102 270 Q104 262 116 262 Q128 262 128 274 V276 H102Z" fill="#e8e8e8"/>
          <rect x="71" y="274" width="28" height="5" rx="2.5" fill="#555"/>
          <rect x="101" y="274" width="28" height="5" rx="2.5" fill="#555"/>
          <path d="M80 266 L88 266 M80 269 L88 269 M112 266 L120 266 M112 269 L120 269" stroke="#e85d5d" stroke-width="1.5"/>
        </g>
        <!-- Winterstiefel -->
        <g id="k-stiefel" class="kleid">
          <rect x="74" y="244" width="24" height="32" rx="6" fill="#6b4226"/>
          <rect x="102" y="244" width="24" height="32" rx="6" fill="#6b4226"/>
          <rect x="72" y="273" width="28" height="6" rx="3" fill="#3b2414"/>
          <rect x="100" y="273" width="28" height="6" rx="3" fill="#3b2414"/>
          <rect x="73" y="242" width="26" height="8" rx="4" fill="#f2efe8"/>
          <rect x="101" y="242" width="26" height="8" rx="4" fill="#f2efe8"/>
        </g>

        <!-- T-Shirt (Lieblingsfarbe) mit Stern -->
        <g id="k-tshirt" class="kleid">
          <rect class="farbe" x="50" y="106" width="20" height="26" rx="8"/>
          <rect class="farbe" x="130" y="106" width="20" height="26" rx="8"/>
          <rect class="farbe-d" x="50" y="126" width="20" height="5" rx="2"/>
          <rect class="farbe-d" x="130" y="126" width="20" height="5" rx="2"/>
          <rect class="farbe" x="68" y="104" width="64" height="88" rx="14"/>
          <path class="farbe-d-strich" d="M89 104 Q100 116 111 104" stroke-width="3.5" fill="none"/>
          <path d="M100 136 L104 145 L114 146 L106.5 152.5 L109 162 L100 157 L91 162 L93.5 152.5 L86 146 L96 145Z" fill="rgba(255,255,255,.85)"/>
        </g>

        <!-- Pullover (Lieblingsfarbe) mit Strickmuster -->
        <g id="k-pulli" class="kleid">
          <rect class="farbe" x="49" y="106" width="22" height="80" rx="10"/>
          <rect class="farbe" x="129" y="106" width="22" height="80" rx="10"/>
          <rect class="farbe" x="67" y="103" width="66" height="90" rx="15"/>
          <rect class="farbe-d" x="87" y="98" width="26" height="9" rx="4.5"/>
          <rect class="farbe-d" x="67" y="181" width="66" height="11" rx="5"/>
          <rect class="farbe-d" x="49" y="176" width="22" height="9" rx="4"/>
          <rect class="farbe-d" x="129" y="176" width="22" height="9" rx="4"/>
          <path d="M70 140 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6" stroke="rgba(255,255,255,.7)" stroke-width="2.5" fill="none"/>
        </g>

        <!-- Winterjacke mit Fellkragen und Taschen -->
        <g id="k-jacke" class="kleid">
          <rect x="45" y="104" width="26" height="84" rx="12" fill="#2d6a8f"/>
          <rect x="129" y="104" width="26" height="84" rx="12" fill="#2d6a8f"/>
          <rect x="63" y="100" width="74" height="98" rx="18" fill="#2d6a8f"/>
          <line x1="100" y1="102" x2="100" y2="196" stroke="#1d4a66" stroke-width="3"/>
          <path d="M65 130 H135 M65 158 H135 M47 135 H69 M131 135 H153 M47 162 H69 M131 162 H153" stroke="#245b7b" stroke-width="2"/>
          <rect x="72" y="168" width="18" height="14" rx="3" fill="#245b7b"/>
          <rect x="110" y="168" width="18" height="14" rx="3" fill="#245b7b"/>
          <path d="M76 98 Q80 90 88 95 Q94 89 100 95 Q106 89 112 95 Q120 90 124 98 Q122 108 100 106 Q78 108 76 98Z" fill="#ece6da"/>
        </g>

        <!-- Regenjacke mit Knöpfen und Taschen -->
        <g id="k-regenjacke" class="kleid">
          <rect x="45" y="104" width="26" height="84" rx="12" fill="#f2c230"/>
          <rect x="129" y="104" width="26" height="84" rx="12" fill="#f2c230"/>
          <path d="M63 118 Q63 100 82 100 H118 Q137 100 137 118 L140 206 H60Z" fill="#f2c230"/>
          <line x1="100" y1="102" x2="100" y2="204" stroke="#c99a12" stroke-width="3"/>
          <circle cx="100" cy="125" r="2.5" fill="#c99a12"/>
          <circle cx="100" cy="150" r="2.5" fill="#c99a12"/>
          <circle cx="100" cy="175" r="2.5" fill="#c99a12"/>
          <path d="M70 172 H90 M110 172 H130" stroke="#c99a12" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M82 100 L100 112 L118 100" stroke="#c99a12" stroke-width="2" fill="none"/>
        </g>

        <!-- Schal -->
        <g id="k-schal" class="kleid">
          <rect x="82" y="96" width="36" height="14" rx="7" fill="#d93b3b"/>
          <rect x="105" y="104" width="12" height="36" rx="4" fill="#d93b3b"/>
          <path d="M107 118 H115 M107 126 H115" stroke="#fff" stroke-width="2"/>
          <path d="M106 140 v4 M110 140 v4 M114 140 v4" stroke="#d93b3b" stroke-width="2"/>
        </g>

        <!-- Handschuhe -->
        <g id="k-handschuhe" class="kleid">
          <circle cx="60" cy="190" r="10" fill="#d93b3b"/>
          <circle cx="140" cy="190" r="10" fill="#d93b3b"/>
          <rect x="51" y="178" width="18" height="5" rx="2.5" fill="#f2efe8"/>
          <rect x="131" y="178" width="18" height="5" rx="2.5" fill="#f2efe8"/>
        </g>

        <!-- ============ KOPF ============ -->
        <g id="kopf">
          <!-- Ohren -->
          <circle class="haut" cx="72" cy="70" r="6.5"/>
          <circle class="haut-d" cx="72" cy="70" r="3"/>
          <circle class="haut" cx="128" cy="70" r="6.5"/>
          <circle class="haut-d" cx="128" cy="70" r="3"/>
          <!-- Gesicht -->
          <circle class="haut" cx="100" cy="68" r="28"/>

          <!-- Extra: Sommersprossen -->
          <g id="e-sommersprossen" class="extra">
            <circle cx="84" cy="78" r="1" class="haut-d"/><circle cx="88" cy="80" r="1" class="haut-d"/>
            <circle cx="86" cy="75" r="1" class="haut-d"/><circle cx="114" cy="78" r="1" class="haut-d"/>
            <circle cx="112" cy="80" r="1" class="haut-d"/><circle cx="116" cy="75" r="1" class="haut-d"/>
          </g>

          <!-- Extra: Bart -->
          <g id="e-bart" class="extra">
            <path class="haar" d="M73 70 Q74 98 100 98 Q126 98 127 70 Q122 86 112 84 Q100 90 88 84 Q78 86 73 70Z"/>
          </g>

          <!-- Wangen -->
          <circle cx="82" cy="80" r="4.5" fill="#f29b9b" opacity=".55"/>
          <circle cx="118" cy="80" r="4.5" fill="#f29b9b" opacity=".55"/>

          <!-- Augen: weiss, Iris (Augenfarbe), Pupille, Glanzpunkt -->
          <ellipse cx="90" cy="70" rx="5" ry="5.5" fill="#fff"/>
          <circle class="auge" cx="90" cy="70.5" r="3.4"/>
          <circle cx="90" cy="70.5" r="1.6" fill="#1b1b1b"/>
          <circle cx="91.3" cy="69" r="1" fill="#fff"/>
          <ellipse cx="110" cy="70" rx="5" ry="5.5" fill="#fff"/>
          <circle class="auge" cx="110" cy="70.5" r="3.4"/>
          <circle cx="110" cy="70.5" r="1.6" fill="#1b1b1b"/>
          <circle cx="111.3" cy="69" r="1" fill="#fff"/>

          <!-- Augenbrauen -->
          <path class="haar-d-strich" d="M84 61 Q90 57.5 96 60.5 M104 60.5 Q110 57.5 116 61" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <!-- Nase -->
          <path class="haut-d-strich" d="M100 72 Q104 78 99 80" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- Mund (Form wird je nach Wetter in app.js geändert) -->
          <path id="mund" d="M90 84 Q100 92 110 84" stroke="#6b2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>

        <!-- ============ FRISUREN (vorne) ============ -->
        <g id="h-kurz" class="frisur">
          <path class="haar" d="M72 64 Q74 36 100 38 Q126 36 128 64 Q120 52 108 50 Q104 56 96 50 Q82 50 72 64Z"/>
        </g>
        <g id="h-igel" class="frisur">
          <path class="haar" d="M72 62 L73 46 L80 50 L83 37 L90 45 L95 32 L101 43 L107 32 L112 45 L118 37 L121 50 L127 46 L128 62 Q116 50 100 51 Q84 50 72 62Z"/>
        </g>
        <g id="h-locken" class="frisur">
          <g class="haar">
            <circle cx="75" cy="60" r="7"/><circle cx="78" cy="50" r="8"/><circle cx="86" cy="42" r="8.5"/>
            <circle cx="97" cy="38" r="9"/><circle cx="108" cy="39" r="9"/><circle cx="118" cy="44" r="8.5"/>
            <circle cx="124" cy="53" r="7.5"/><circle cx="126" cy="62" r="6"/>
            <circle cx="88" cy="50" r="6"/><circle cx="100" cy="48" r="6"/><circle cx="112" cy="50" r="6"/>
          </g>
        </g>
        <g id="h-lang" class="frisur">
          <path class="haar" d="M71 70 Q70 36 100 37 Q130 36 129 70 Q126 54 114 48 Q100 58 84 50 Q75 56 71 70Z"/>
        </g>
        <g id="h-zopf" class="frisur">
          <path class="haar" d="M72 66 Q72 36 100 37 Q128 36 128 66 Q122 50 104 48 Q88 50 80 58 Q76 62 72 66Z"/>
        </g>
        <g id="h-glatze" class="frisur">
          <ellipse cx="90" cy="47" rx="7" ry="3.5" fill="#fff" opacity=".35" transform="rotate(-20 90 47)"/>
        </g>

        <!-- Extra: normale Brille -->
        <g id="e-brille" class="extra">
          <rect x="82" y="63" width="16" height="14" rx="5" fill="rgba(255,255,255,.15)" stroke="#333" stroke-width="2"/>
          <rect x="102" y="63" width="16" height="14" rx="5" fill="rgba(255,255,255,.15)" stroke="#333" stroke-width="2"/>
          <path d="M98 69 H102 M82 68 L74 66 M118 68 L126 66" stroke="#333" stroke-width="2"/>
        </g>

        <!-- ============ KOPFBEDECKUNG ============ -->
        <!-- Kapuze (bei Regen ohne Schirm, z.B. wenn es windig ist) -->
        <g id="k-kapuze" class="kleid">
          <path d="M68 86 Q60 30 100 28 Q140 30 132 86" stroke="#f2c230" stroke-width="11" fill="none" stroke-linecap="round"/>
          <path d="M72 46 Q100 26 128 46" stroke="#f2c230" stroke-width="14" fill="none" stroke-linecap="round"/>
        </g>

        <!-- Mütze mit Bommel -->
        <g id="k-muetze" class="kleid">
          <path d="M70 60 Q71 28 100 28 Q129 28 130 60Z" fill="#3a8f6b"/>
          <path d="M84 32 V58 M100 28 V58 M116 32 V58" stroke="#2e7356" stroke-width="2"/>
          <rect x="68" y="54" width="64" height="12" rx="6" fill="#2e7356"/>
          <circle cx="100" cy="25" r="8" fill="#f4f4f4"/>
        </g>

        <!-- Sonnen-Cap -->
        <g id="k-cap" class="kleid">
          <path d="M72 56 Q73 34 100 34 Q127 34 128 56Z" fill="#2b7bd6"/>
          <path d="M116 53 Q142 52 152 59 L124 60Z" fill="#1f5fa8"/>
          <circle cx="100" cy="34" r="2.5" fill="#1f5fa8"/>
        </g>

        <!-- Sonnenbrille -->
        <g id="k-brille" class="kleid">
          <rect x="81" y="64" width="17" height="12" rx="4" fill="#222"/>
          <rect x="102" y="64" width="17" height="12" rx="4" fill="#222"/>
          <line x1="98" y1="68" x2="102" y2="68" stroke="#222" stroke-width="2"/>
          <path d="M84 67 l4 -1.5" stroke="#fff" stroke-width="1.5" opacity=".6" stroke-linecap="round"/>
          <path d="M105 67 l4 -1.5" stroke="#fff" stroke-width="1.5" opacity=".6" stroke-linecap="round"/>
        </g>
      </svg>

      <p class="tipp nur-wetter" id="tipp"></p>
      <button type="button" id="anpassen-knopf" class="knopf nur-wetter">✏️ Männli anpassen</button>
    </section>

    <!-- ===================== EDITOR ===================== -->
    <section id="editor" class="karte" hidden>
      <h2>Dein Männli gestalten</h2>
      <label class="zeile">
        <span class="titel">Name</span>
        <input id="name-feld" type="text" maxlength="16" placeholder="z.B. Max">
      </label>
      <!-- Die Auswahl-Knöpfe werden von app.js erzeugt -->
      <div id="editor-optionen"></div>
      <div class="editor-knoepfe">
        <button type="button" id="zufall-knopf" class="knopf">🎲 Zufällig</button>
        <button type="button" id="fertig-knopf" class="knopf knopf-haupt">✓ Fertig</button>
      </div>
    </section>

    <section class="karte nur-wetter">
      <h2>Nächste Stunden</h2>
      <div class="stunden" id="stunden"></div>
    </section>

    <section class="karte nur-wetter">
      <h2>Morgen früh (7 Uhr)</h2>
      <p id="morgen">–</p>
    </section>

    <section class="karte nur-wetter">
      <h2>Nächste 5 Tage</h2>
      <p class="hinweis">Tippe auf einen Tag, um zu sehen, was das Männli anzieht.</p>
      <div id="tage"></div>
    </section>

    <footer class="nur-wetter">
      <span id="stand"></span><br>
      Wetterdaten: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
